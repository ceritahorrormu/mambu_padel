    // --- G. CONFIRM DELETE MODAL ---
    function confirmDeleteTournament(trId) {
      state.openMenuId = null;
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 modal-backdrop" onclick="if(event.target===this) closeModal()">
          <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl w-full max-w-sm p-6 space-y-4 modal-panel">
            <div class="w-12 h-12 rounded-2xl bg-rose-100 dark:bg-rose-900/30 text-rose-600 flex items-center justify-center">
              <i data-lucide="trash-2" class="w-6 h-6"></i>
            </div>
            <div>
              <h3 class="text-lg font-extrabold text-slate-900 dark:text-white">${t('confirmDeleteTitle')}</h3>
              <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${t('confirmDeleteDesc')}</p>
            </div>
            <div class="flex justify-end gap-2 pt-2">
              <button onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">${t('cancel')}</button>
              <button onclick="executeDeleteTournament('${trId}')" class="px-5 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-sm font-bold">${t('delete')}</button>

    // =========================================================================
    // 11. EVENT HANDLERS & ACTIONS
    // =========================================================================
    function toggleLanguage() {
      state.lang = state.lang === 'id' ? 'en' : 'id';
      saveState();
      render();
    }

    function toggleDarkMode() {
      state.darkMode = !state.darkMode;
      applyTheme();
      saveState();
      render();
    }

    function setFilter(f) {
      state.filter = f;
      render();
    }

    function setSearchQuery(q) {
      state.searchQuery = q;
      render();
    }

    function toggleCardMenu(id) {
      state.openMenuId = state.openMenuId === id ? null : id;
      render();
    }

    function openTournament(id) {
      state.openMenuId = null;
      state.activeTournamentId = id;
      state.view = 'detail';
      state.detailTab = 'matches';
      state.swapModeRound = null;
      state.swapSelection = null;
      const tr = state.tournaments.find(x => x.id === id);
      if (tr) subscribeToTournament(tr);
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goHome() {
      unsubscribeRealtime();
      state.view = 'home';
      state.activeTournamentId = null;
      state.swapModeRound = null;
      state.swapSelection = null;
      render();
    }

    function setDetailTab(tab) {
      state.detailTab = tab;
      render();
    }

    function toggleSortOrder(trId) {
      const tr = state.tournaments.find(x => x.id === trId);
      if (!tr) return;
      tr.sortByWins = !tr.sortByWins;
      saveState();
      render();
    }

    function handleGenerateNextRound(trId) {
      const tr = state.tournaments.find(x => x.id === trId);
      if (!tr) return;
      const next = generateNextRound(tr);
      if (!next) return;
      tr.rounds.push(next);
      state.swapModeRound = null;
      state.swapSelection = null;
      saveState(true);
      render();
      showToast(t('roundAddedToast'), 'success');
    }

    function toggleFinishTournament(trId) {
      const tr = state.tournaments.find(x => x.id === trId);
      if (!tr) return;
      if (tr.status === 'active') {
        tr.status = 'finished';
        saveState(true);
        render();
        showToast(t('finishedToast'), 'success');
        if (window.confetti) {
          confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
        }
      } else {
        tr.status = 'active';
        saveState();
        render();
      }
    }

    function toggleSwapMode(roundNum) {
      state.swapModeRound = state.swapModeRound === roundNum ? null : roundNum;
      state.swapSelection = null;
      render();
    }

    function handleSwapTap(trId, rIdx, mIdx, side, slotIdx) {
      const tr = state.tournaments.find(x => x.id === trId);
      if (!tr) return;
      if (!state.swapSelection) {
        state.swapSelection = { roundIdx: rIdx, matchIdx: mIdx, side, slotIdx };
        render();
        return;
      }
      const prev = state.swapSelection;
      if (prev.roundIdx === rIdx) {
        const m1 = tr.rounds[prev.roundIdx].matches[prev.matchIdx];
        const m2 = tr.rounds[rIdx].matches[mIdx];
        const tmp = m1[prev.side][prev.slotIdx];
        m1[prev.side][prev.slotIdx] = m2[side][slotIdx];
        m2[side][slotIdx] = tmp;
        saveState();
        showToast(t('savedToast'), 'success');
      }
      state.swapSelection = null;
      render();
    }

    function duplicateTournament(trId) {
      state.openMenuId = null;
      const tr = state.tournaments.find(x => x.id === trId);
      if (!tr) return;
      const copy = JSON.parse(JSON.stringify(tr));
      copy.id = uid('tr');
      copy.name = `${tr.name} (Copy)`;
      copy.status = 'active';
      copy.rounds = [];
      const r1 = generateNextRound(copy);
      if (r1) copy.rounds.push(r1);
      state.tournaments.unshift(copy);
      saveState();
      render();
      showToast(t('createdToast'), 'success');
    }

    function executeDeleteTournament(trId) {
      state.tournaments = state.tournaments.filter(x => x.id !== trId);
      if (state.activeTournamentId === trId) {
        state.view = 'home';
        state.activeTournamentId = null;
      }
      saveState();
      closeModal();
      render();
    }

    function exportTournamentCsv(trId) {
      state.openMenuId = null;
      const tr = state.tournaments.find(x => x.id === trId);
      if (!tr) return;
      const lb = computeLeaderboard(tr);
      const rows = [
        ['Rank', 'Name', 'Wins', 'Losses', 'Ties', 'Diff', 'Comp (+M)', 'Total Points'],
        ...lb.map((r, i) => [i + 1, `"${r.name.replace(/"/g, '""')}"`, r.wins, r.losses, r.ties, r.diff, r.compPoints, r.totalPoints])
      ];
      const csv = rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${tr.name.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_leaderboard.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('CSV downloaded!', 'success');
    }

    function exportAllJson() {
      const blob = new Blob([JSON.stringify(state.tournaments, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `pdlup_pro_backup_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Backup JSON downloaded!', 'success');
    }

    function importAllJson(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (Array.isArray(data)) {
            state.tournaments = data;
            saveState();
            closeModal();
            render();
            showToast('Backup imported!', 'success');
          }
        } catch (e) {
          showToast('Invalid JSON file', 'error');
        }
      };
      reader.readAsText(file);
    }

    function resetDemoData() {
      state.tournaments = createDemoTournaments();
      state.view = 'home';
      state.activeTournamentId = null;
      saveState();
      closeModal();
      render();
      showToast('Demo data restored!', 'info');
    }

    // Close open card menu when clicking outside
    document.addEventListener('click', () => {
      if (state.openMenuId) {
        state.openMenuId = null;
        render();
      }
    });

    function copyLiveLink(trId, asAdmin) {
      const tr = state.tournaments.find(x => x.id === trId);
      if (!tr) return;
      ensureTournamentMeta(tr);
      const base = (window.location.origin && window.location.origin !== 'null' && !window.location.origin.startsWith('file'))
        ? (window.location.origin + window.location.pathname)
        : 'https://ceritahorrormu.github.io/mambu_padel/';

      let url = '';
      if (state.cloud.connected) {
        url = asAdmin
          ? `${base}?code=${tr.shareCode}&pin=${tr.adminPin}`
          : `${base}?code=${tr.shareCode}`;
      } else {
        const hash = encodeSnapshotHash(tr);
        url = `${base}#share=${hash}`;
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(() => showToast(t('linkCopied'), 'success')).catch(() => fallbackCopyText(url));
      } else {
        fallbackCopyText(url);
      }
    }

    function fallbackCopyText(str) {
      const tmp = document.createElement('textarea');
      tmp.value = str;
      document.body.appendChild(tmp);
      tmp.select();
      try { document.execCommand('copy'); showToast(t('linkCopied'), 'success'); } catch (e) {}
      tmp.remove();
    }

    function openJoinCodeModal() {
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 modal-backdrop" onclick="if(event.target===this) closeModal()">
          <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl w-full max-w-sm p-6 space-y-4 modal-panel">
            <div class="flex items-center justify-between">
              <h3 class="text-lg font-extrabold text-slate-900 dark:text-white">${t('joinModalTitle')}</h3>
              <button onclick="closeModal()" class="w-8 h-8 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400">${t('joinModalDesc')}</p>
            <div class="space-y-3">
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">${t('shareCodeLabel')}</label>
                <input id="join-code-input" type="text" maxlength="8" placeholder="e.g. JKT82A" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-mono font-bold uppercase tracking-widest text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" />
              </div>
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">${t('adminPinLabel')}</label>
                <input id="join-pin-input" type="password" maxlength="8" placeholder="4-digit PIN" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" />
              </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
              <button onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">${t('cancel')}</button>
              <button onclick="joinTournamentByCode(document.getElementById('join-code-input').value, document.getElementById('join-pin-input').value)" class="px-5 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold">${t('joinNow')}</button>
            </div>
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons({ nodes: [root] });
    }

    function openUnlockAdminModal(trId) {
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 modal-backdrop" onclick="if(event.target===this) closeModal()">
          <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl w-full max-w-xs p-6 space-y-4 modal-panel">
            <h3 class="text-base font-extrabold text-slate-900 dark:text-white">${t('unlockAdmin')}</h3>
            <input id="unlock-pin-input" type="password" maxlength="8" placeholder="Masukkan 4-digit Admin PIN" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-mono text-center tracking-widest text-base focus:outline-none focus:ring-2 focus:ring-brand-500" />
            <div class="flex justify-end gap-2">
              <button onclick="closeModal()" class="px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-500">${t('cancel')}</button>
              <button onclick="verifyUnlockAdmin('${trId}')" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-bold">${t('unlockAdmin')}</button>
            </div>
          </div>
        </div>
      `;
    }

    function verifyUnlockAdmin(trId) {
      const tr = state.tournaments.find(x => x.id === trId);
      const inp = document.getElementById('unlock-pin-input');
      if (!tr || !inp) return;
      if (inp.value.trim() === tr.adminPin) {
        tr.readOnly = false;
        saveState(false);
        closeModal();
        render();
        showToast(t('adminUnlocked'), 'success');
      } else {
        showToast(t('invalidPin'), 'error');
      }
    }

    function saveCloudConfig() {
      const u = document.getElementById('sb-url');
      const k = document.getElementById('sb-key');
      if (!u || !k) return;
      state.cloud.url = u.value.trim();
      state.cloud.anonKey = k.value.trim();
      initSupabaseClient(true);
      saveState(false);
      render();
      openAppSettingsModal();
    }

    function disconnectCloud() {
      state.cloud.url = '';
      state.cloud.anonKey = '';
      unsubscribeRealtime();
      initSupabaseClient(false);
      saveState(false);
      render();
      openAppSettingsModal();
    }

    // Boot
    loadState();
    render();
    checkUrlDeepLink();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
    }
  </script>
