  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(at 0% 0%, rgba(20, 184, 166, 0.10) 0px, transparent 48%),
        radial-gradient(at 100% 0%, rgba(6, 182, 212, 0.08) 0px, transparent 45%);
      background-attachment: fixed;
    }
    .dark body, body.dark {
      background-image:
        radial-gradient(at 10% 0%, rgba(20, 184, 166, 0.16) 0px, transparent 50%),
        radial-gradient(at 90% 0%, rgba(6, 182, 212, 0.12) 0px, transparent 45%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .dark .glass-card {
      background: rgba(15, 23, 42, 0.78);
    }
    .btn-turq {
      background: linear-gradient(135deg, #14b8a6 0%, #0d9488 55%, #0891b2 100%);
    }
    .btn-turq:hover {
      background: linear-gradient(135deg, #0d9488 0%, #0f766e 60%, #0e7490 100%);
    }

    .champion-glow {
      background: radial-gradient(circle at 50% 40%, rgba(250, 204, 21, 0.22) 0%, rgba(250, 204, 21, 0.05) 45%, transparent 72%);
    }
    .dark .champion-glow {
      background: radial-gradient(circle at 50% 40%, rgba(250, 204, 21, 0.16) 0%, rgba(37, 99, 235, 0.08) 45%, transparent 72%);
    }

    .score-pill {
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }
    .score-pill:hover {
      transform: translateY(-1px);
    }

    .modal-backdrop {
      animation: fadeIn 0.16s ease-out;
    }
    .modal-panel {
      animation: slideUp 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Subtle custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.35); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.6); }
  </style>

      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

                { id: 'td3', court: 'Court 1 — Pro', sideA: ['tm1'], sideB: ['tm3'], scoreA: 16, scoreB: 8 },
                { id: 'td4', court: 'Court 2 — Pro', sideA: ['tm4'], sideB: ['tm2'], scoreA: 14, scoreB: 10 },
              ],
              resting: []
            },
            {
              number: 3,
              matches: [
                { id: 'td5', court: 'Court 1 — Pro', sideA: ['tm1'], sideB: ['tm4'], scoreA: 14, scoreB: 10 },
                { id: 'td6', court: 'Court 2 — Pro', sideA: ['tm3'], sideB: ['tm2'], scoreA: 12, scoreB: 12 },
              ],
              resting: []
            }
          ]
        }
      ];
    }

    // =========================================================================
    // 3. APPLICATION STATE & PERSISTENCE
    // =========================================================================
    let state = {
      lang: 'id',
      darkMode: false,
      view: 'home', // 'home' | 'detail'
      filter: 'all', // 'all' | 'active' | 'past'
      searchQuery: '',
      activeTournamentId: null,
      detailTab: 'matches', // mobile/sub tab: 'matches' | 'leaderboard' | 'analytics'
      swapModeRound: null, // round number currently in swap mode
      swapSelection: null, // { roundIdx, matchIdx, side, slotIdx, entryId }
      openMenuId: null,
      tournaments: createDemoTournaments().map(ensureTournamentMeta),
      cloud: {
        url: DEFAULT_SUPABASE_URL,
        anonKey: DEFAULT_SUPABASE_ANON_KEY,
        connected: false,
        status: 'local', // 'local' | 'live' | 'syncing' | 'error'
      },
    };

    let supabaseClient = null;
    let realtimeChannel = null;
    let activeChart = null;
    let timerInterval = null;
    let timerSeconds = 0;
    let timerRunning = false;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.tournaments)) {
            state.tournaments = parsed.tournaments.map(ensureTournamentMeta);
            if (parsed.lang) state.lang = parsed.lang;
            if (typeof parsed.darkMode === 'boolean') state.darkMode = parsed.darkMode;
            if (parsed.cloud && parsed.cloud.url && parsed.cloud.anonKey) {
              state.cloud.url = parsed.cloud.url;
              state.cloud.anonKey = parsed.cloud.anonKey;
            }
          }
        }
      } catch (e) {}
      applyTheme();
      initSupabaseClient(false);
    }

    function saveState(syncActiveTournament = false) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          lang: state.lang,
          darkMode: state.darkMode,
          tournaments: state.tournaments,
          cloud: { url: state.cloud.url, anonKey: state.cloud.anonKey },
        }));
      } catch (e) {}
      if (syncActiveTournament && state.cloud.connected && state.activeTournamentId) {
        const tr = state.tournaments.find(x => x.id === state.activeTournamentId);
        if (tr && !tr.readOnly) {
          syncTournamentToCloud(tr, true);
        }
      }
    }

    // =========================================================================
    // 3B. SUPABASE REALTIME LIVE SYNC & SHARE LINK ENGINE
    // =========================================================================
    function initSupabaseClient(notify = true) {
      if (state.cloud.url && state.cloud.anonKey && window.supabase && typeof window.supabase.createClient === 'function') {
        try {
          supabaseClient = window.supabase.createClient(state.cloud.url.trim(), state.cloud.anonKey.trim());
          state.cloud.connected = true;
          state.cloud.status = 'live';
          if (notify) showToast(t('cloudConnected'), 'success');
          return true;
        } catch (e) {
          supabaseClient = null;
          state.cloud.connected = false;
          state.cloud.status = 'error';
          if (notify) showToast('Supabase connection error', 'error');
          return false;
        }
      }
      supabaseClient = null;
      state.cloud.connected = false;
      state.cloud.status = 'local';
      return false;
    }

    async function syncTournamentToCloud(tr, silent = false) {
      ensureTournamentMeta(tr);
      if (!supabaseClient) {
        if (!silent) showToast(t('cloudNeedSetup'), 'info');
        return false;
      }
      state.cloud.status = 'syncing';
      try {
        const cleanPayload = { ...tr, readOnly: false };
        const { error } = await supabaseClient.rpc('upsert_tournament_with_pin', {
          p_id: tr.id,
          p_share_code: tr.shareCode,
          p_admin_pin: tr.adminPin,
          p_name: tr.name,
          p_status: tr.status,
          p_payload: cleanPayload,
        });
        if (error) throw error;
        tr.cloudSynced = true;
        state.cloud.status = 'live';
        saveState(false);
        if (!silent) {
          render();
          showToast(t('syncedLiveToast'), 'success');
        }
        return true;
      } catch (err) {
        state.cloud.status = 'error';
        if (!silent) showToast('Sync gagal: ' + (err.message || 'cek konfigurasi Supabase'), 'error');
        return false;
      }
    }

    function unsubscribeRealtime() {
      if (realtimeChannel && supabaseClient) {
        try { supabaseClient.removeChannel(realtimeChannel); } catch (e) {}
      }
      realtimeChannel = null;
    }

    function subscribeToTournament(tr) {
      unsubscribeRealtime();
      if (!supabaseClient || !tr) return;
      try {
        realtimeChannel = supabaseClient
          .channel('tournament_' + tr.id)
          .on('postgres_changes', {
            event: 'UPDATE',
            schema: 'public',
            table: 'tournaments',
            filter: 'id=eq.' + tr.id,
          }, (payload) => {
            if (payload && payload.new && payload.new.payload) {
              const incoming = ensureTournamentMeta(payload.new.payload);
              const idx = state.tournaments.findIndex(x => x.id === tr.id);
              if (idx >= 0) {
                const keepReadOnly = state.tournaments[idx].readOnly;
                state.tournaments[idx] = { ...incoming, readOnly: keepReadOnly, cloudSynced: true };
                saveState(false);
                if (state.activeTournamentId === tr.id) render();
              }
            }
          })
          .subscribe();
      } catch (e) {}
    }

    async function joinTournamentByCode(codeRaw, pinRaw) {
      const code = String(codeRaw || '').trim().toUpperCase();
      const pin = String(pinRaw || '').trim();
      if (!code) {
        showToast(state.lang === 'id' ? 'Masukkan kode turnamen' : 'Enter a tournament code', 'error');
        return;
      }

      // Check local first if cloud not connected
      const localMatch = state.tournaments.find(x => (x.shareCode || '').toUpperCase() === code);
      if (!supabaseClient) {
        if (localMatch) {
          localMatch.readOnly = pin ? (pin !== localMatch.adminPin) : false;
          closeModal();
          openTournament(localMatch.id);
          return;
        }
        showToast(t('cloudNeedSetup'), 'info');
        return;
      }

      try {
        const { data, error } = await supabaseClient
          .from('tournaments')
          .select('*')
          .eq('share_code', code)
          .single();
        if (error || !data || !data.payload) {
          showToast(state.lang === 'id' ? 'Kode turnamen tidak ditemukan di Cloud' : 'Tournament code not found in Cloud', 'error');
          return;
        }
        const incoming = ensureTournamentMeta(data.payload);
        const isAdmin = Boolean(pin && pin === data.admin_pin);
        incoming.readOnly = !isAdmin;
        incoming.cloudSynced = true;

        const idx = state.tournaments.findIndex(x => x.id === incoming.id);
        if (idx >= 0) state.tournaments[idx] = incoming;
        else state.tournaments.unshift(incoming);

        saveState(false);
        closeModal();
        openTournament(incoming.id);
        showToast(isAdmin ? t('adminUnlocked') : t('viewerModeBadge'), 'success');
      } catch (err) {
        showToast('Gagal memuat turnamen live', 'error');
      }
    }

    function encodeSnapshotHash(tr) {
      try {
        const slim = { ...tr, adminPin: undefined, readOnly: true };
        const json = JSON.stringify(slim);
        const bytes = new TextEncoder().encode(json);
        let bin = '';
        bytes.forEach(b => { bin += String.fromCharCode(b); });
        return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      } catch (e) { return ''; }
    }

    function decodeSnapshotHash(str) {
      try {
        let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return JSON.parse(new TextDecoder().decode(bytes));
      } catch (e) { return null; }
    }

    function checkUrlDeepLink() {
      try {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const pin = params.get('pin') || '';
        if (code) {
          joinTournamentByCode(code, pin);
          return;
        }
        if (window.location.hash && window.location.hash.startsWith('#share=')) {
          const snap = decodeSnapshotHash(window.location.hash.slice(7));
          if (snap && snap.id && Array.isArray(snap.entries)) {
            ensureTournamentMeta(snap);
            snap.readOnly = true;
            const idx = state.tournaments.findIndex(x => x.id === snap.id);
            if (idx >= 0) state.tournaments[idx] = snap;
            else state.tournaments.unshift(snap);
            state.activeTournamentId = snap.id;
            state.view = 'detail';
            render();
          }
        }
      } catch (e) {}
    }

    function applyTheme() {
      const html = document.documentElement;
      if (state.darkMode) {
        html.classList.add('dark');
        html.classList.remove('light');
      } else {
        html.classList.remove('dark');
        html.classList.add('light');
      }
    }

    function t(key) {
      return (I18N[state.lang] && I18N[state.lang][key]) || I18N.en[key] || key;
    }

    function getFormatMeta(formatId) {
      return FORMATS.find(f => f.id === formatId) || FORMATS[0];
    }

    function uid(prefix = 'id') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message, type = 'info') {
      const root = document.getElementById('toast-root');
      const el = document.createElement('div');
      const colors = type === 'success'
        ? 'bg-emerald-600 text-white'
        : type === 'error'
        ? 'bg-rose-600 text-white'
        : 'bg-slate-900 dark:bg-slate-800 text-white border border-slate-700';
      el.className = `pointer-events-auto px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium flex items-center gap-2 modal-panel ${colors}`;
      el.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle-2' : type === 'error' ? 'alert-circle' : 'info'}" class="w-4 h-4 shrink-0"></i><span>${escapeHtml(message)}</span>`;
      root.appendChild(el);
      if (window.lucide) lucide.createIcons({ nodes: [el] });
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s ease';
        setTimeout(() => el.remove(), 260);
      }, 2600);
    }

    // =========================================================================
    // 4. MATCHMAKING & LEADERBOARD ENGINE
    // =========================================================================
    function computeLeaderboard(tournament) {
      const map = {};
      tournament.entries.forEach(e => {
        map[e.id] = {
          id: e.id,
          name: e.name,
          gender: e.gender || 'M',
          wins: 0,
          losses: 0,
          ties: 0,
          played: 0,
          pointsFor: 0,
          pointsAgainst: 0,
          missedCount: 0,
          compPoints: 0,
          history: [],
          roundPoints: [],
        };
      });

      tournament.rounds.forEach(r => {
        let roundTotalScored = 0;
        let roundSidesCount = 0;

        r.matches.forEach(m => {
          if (m.scoreA !== null && m.scoreB !== null) {
            const sA = Number(m.scoreA);
            const sB = Number(m.scoreB);
            roundTotalScored += (sA + sB);
            roundSidesCount += 2;

            const aWon = sA > sB;
            const bWon = sB > sA;
            const tied = sA === sB;

            m.sideA.forEach(id => {
              if (!map[id]) return;
              map[id].played++;
              map[id].pointsFor += sA;
              map[id].pointsAgainst += sB;
              if (aWon) map[id].wins++;
              else if (bWon) map[id].losses++;
              else if (tied) map[id].ties++;
              map[id].history.push({ round: r.number, court: m.court, myScore: sA, oppScore: sB, partnerIds: m.sideA.filter(x => x !== id), oppIds: m.sideB });
              map[id].roundPoints.push({ round: r.number, pts: sA });
            });

            m.sideB.forEach(id => {
              if (!map[id]) return;
              map[id].played++;
              map[id].pointsFor += sB;
              map[id].pointsAgainst += sA;
              if (bWon) map[id].wins++;
              else if (aWon) map[id].losses++;
              else if (tied) map[id].ties++;
              map[id].history.push({ round: r.number, court: m.court, myScore: sB, oppScore: sA, partnerIds: m.sideB.filter(x => x !== id), oppIds: m.sideA });
              map[id].roundPoints.push({ round: r.number, pts: sB });
            });
          }
        });

        // Compensation points (+M) for resting players in completed rounds
        if (roundSidesCount > 0 && Array.isArray(r.resting) && r.resting.length > 0) {
          let comp = 0;
          if (tournament.compensationMode === 'auto') {
            comp = Math.round(roundTotalScored / roundSidesCount);
          } else if (typeof tournament.compensationMode === 'number') {
            comp = tournament.compensationMode;
          }
          r.resting.forEach(id => {
            if (!map[id]) return;
            map[id].missedCount++;
            map[id].compPoints += comp;
            map[id].roundPoints.push({ round: r.number, pts: comp, resting: true });
          });
        }
      });

      const rows = Object.values(map).map(p => ({
        ...p,
        diff: p.pointsFor - p.pointsAgainst,
        totalPoints: p.pointsFor + p.compPoints,
      }));

      rows.sort((a, b) => {
        if (tournament.sortByWins) {
          if (b.wins !== a.wins) return b.wins - a.wins;
          if (b.totalPoints !== a.totalPoints) return b.totalPoints - a.totalPoints;
          if (b.diff !== a.diff) return b.diff - a.diff;
        } else {
          if (b.totalPoints !== a.totalPoints) return b.totalPoints - a.totalPoints;
          if (b.diff !== a.diff) return b.diff - a.diff;
          if (b.wins !== a.wins) return b.wins - a.wins;
        }
        return a.name.localeCompare(b.name);
      });

      return rows;
    }

    function generateNextRound(tournament) {
      const fmt = getFormatMeta(tournament.format);
      const nextNum = tournament.rounds.length + 1;
      const entries = [...tournament.entries];
      const courts = tournament.courts.length > 0 ? tournament.courts : ['Court 1'];

      // Track play counts, partner counts, opponent counts
      const playCount = {};
      const partnerCount = {};
      const oppCount = {};
      entries.forEach(e => { playCount[e.id] = 0; });

      const pairKey = (a, b) => [a, b].sort().join('|');
      tournament.rounds.forEach(r => {
        r.matches.forEach(m => {
          [...m.sideA, ...m.sideB].forEach(id => { if (playCount[id] !== undefined) playCount[id]++; });
          if (m.sideA.length === 2) {
            const k = pairKey(m.sideA[0], m.sideA[1]);
            partnerCount[k] = (partnerCount[k] || 0) + 1;
          }
          if (m.sideB.length === 2) {
            const k = pairKey(m.sideB[0], m.sideB[1]);
            partnerCount[k] = (partnerCount[k] || 0) + 1;
          }
          m.sideA.forEach(a => m.sideB.forEach(b => {
            const k = pairKey(a, b);
            oppCount[k] = (oppCount[k] || 0) + 1;
          }));
        });
      });

      const maxActive = Math.min(entries.length, courts.length * fmt.perCourt);
      const activeCount = Math.floor(maxActive / fmt.perCourt) * fmt.perCourt;

      // Special case: Knockout progression
      if (tournament.format === 'knockout') {
        if (tournament.rounds.length === 0) {
          const shuffled = [...entries];
          const matches = [];
          const count = Math.floor(shuffled.length / 2);
          for (let i = 0; i < count; i++) {
            matches.push({
              id: uid('m'),
              court: courts[i % courts.length],
              sideA: [shuffled[i * 2].id],
              sideB: [shuffled[i * 2 + 1].id],
              scoreA: null,
              scoreB: null,
            });
          }
          const resting = shuffled.slice(count * 2).map(e => e.id);
          return { number: nextNum, matches, resting };
        } else {
          const prev = tournament.rounds[tournament.rounds.length - 1];
          const winners = prev.matches.map(m => {
            if (m.scoreA === null || m.scoreB === null) return m.sideA[0];
            return Number(m.scoreA) >= Number(m.scoreB) ? m.sideA[0] : m.sideB[0];
          });
          if (winners.length < 2) {
            showToast(state.lang === 'id' ? 'Babak Final sudah tercapai!' : 'Final stage already reached!', 'info');
            return null;
          }
          const matches = [];
          for (let i = 0; i < Math.floor(winners.length / 2); i++) {
            matches.push({
              id: uid('m'),
              court: courts[i % courts.length],
              sideA: [winners[i * 2]],
              sideB: [winners[i * 2 + 1]],
              scoreA: null,
              scoreB: null,
            });
          }
          return { number: nextNum, matches, resting: [] };
        }
      }

      // Select active players prioritizing those with fewest matches played
      const sortedByPlay = [...entries].sort((a, b) => {
        const diff = (playCount[a.id] || 0) - (playCount[b.id] || 0);
        if (diff !== 0) return diff;
        return Math.random() - 0.5;
      });

      // King of the Hill (KOTH) promotion/relegation
      if (tournament.format === 'koth' && tournament.rounds.length > 0) {
        const prev = tournament.rounds[tournament.rounds.length - 1];
        const courtBuckets = prev.matches.map(m => {
          const aWon = (m.scoreA ?? 0) >= (m.scoreB ?? 0);
          return {
            winners: aWon ? [...m.sideA] : [...m.sideB],
            losers: aWon ? [...m.sideB] : [...m.sideA],
          };
        });
        // Move winners up 1 court, losers down 1 court
        const newCourtsPlayers = Array.from({ length: courtBuckets.length }, () => []);
        courtBuckets.forEach((b, idx) => {
          const upIdx = Math.max(0, idx - 1);
          const downIdx = Math.min(courtBuckets.length - 1, idx + 1);
          newCourtsPlayers[upIdx].push(...b.winners);
          newCourtsPlayers[downIdx].push(...b.losers);
        });
        const matches = newCourtsPlayers.map((group, idx) => {
          // Split previous winners so they play against each other on the new court
          const p = group.length === 4 ? [group[0], group[2], group[1], group[3]] : group;
          return {
            id: uid('m'),
            court: courts[idx] || `Court ${idx + 1}`,
            sideA: p.slice(0, 2),
            sideB: p.slice(2, 4),
            scoreA: null,
            scoreB: null,
          };
        });
        return { number: nextNum, matches, resting: prev.resting || [] };
      }

      // Mexicano & Team Mexicano (rank-based)
      if ((tournament.format === 'mexicano' || tournament.format === 'team_mexicano') && tournament.rounds.length > 0) {
        const lb = computeLeaderboard(tournament);
        const lbIds = lb.map(r => r.id);
        // Pick active pool: fewest played first, then ranked order
        const activeIds = sortedByPlay.slice(0, activeCount).map(e => e.id);
        const resting = sortedByPlay.slice(activeCount).map(e => e.id);
        activeIds.sort((a, b) => lbIds.indexOf(a) - lbIds.indexOf(b));

        const matches = [];
        if (tournament.format === 'team_mexicano') {
          for (let i = 0; i < activeIds.length; i += 2) {
            matches.push({
              id: uid('m'),
              court: courts[(i / 2) % courts.length],
              sideA: [activeIds[i]],
              sideB: [activeIds[i + 1]],
              scoreA: null,
              scoreB: null,
            });
          }
        } else {
          for (let i = 0; i < activeIds.length; i += 4) {
            const g = activeIds.slice(i, i + 4);
            const strict = tournament.mexicanoPairing === '14v23';
            matches.push({
              id: uid('m'),
              court: courts[(i / 4) % courts.length],
              sideA: strict ? [g[0], g[3]] : [g[0], g[2]],
              sideB: strict ? [g[1], g[2]] : [g[1], g[3]],
              scoreA: null,
              scoreB: null,
            });
          }
        }
        return { number: nextNum, matches, resting };
      }

      // Mix Americano (M + F pairs)
      if (tournament.format === 'mix_americano') {
        const males = sortedByPlay.filter(e => e.gender === 'M');
        const females = sortedByPlay.filter(e => e.gender === 'F');
        const pairsPossible = Math.min(males.length, females.length);
        const courtPairs = Math.min(Math.floor(pairsPossible / 2), courts.length);
        const useM = males.slice(0, courtPairs * 2);
        const useF = females.slice(0, courtPairs * 2);
        const usedSet = new Set([...useM, ...useF].map(x => x.id));
        const resting = entries.filter(e => !usedSet.has(e.id)).map(e => e.id);

        // Rotate female array by round number to minimize repeated partners
        const shift = tournament.rounds.length % Math.max(1, useF.length);
        const rotF = useF.slice(shift).concat(useF.slice(0, shift));

        const matches = [];
        for (let c = 0; c < courtPairs; c++) {
          matches.push({
            id: uid('m'),
            court: courts[c],
            sideA: [useM[c * 2].id, rotF[c * 2].id],
            sideB: [useM[c * 2 + 1].id, rotF[c * 2 + 1].id],
            scoreA: null,
            scoreB: null,
          });
        }
        return { number: nextNum, matches, resting };
      }

      // Team Americano & Single 1v1 (2 entries per court)
      if (fmt.perCourt === 2) {
        const active = sortedByPlay.slice(0, activeCount).map(e => e.id);
        const resting = sortedByPlay.slice(activeCount).map(e => e.id);
        const pool = [...active];
        const matches = [];
        let cIdx = 0;
        while (pool.length >= 2) {
          const p1 = pool.shift();
          // Pick opponent with lowest prior meetings
          let bestIdx = 0;
          let bestScore = Infinity;
          pool.forEach((cand, idx) => {
            const sc = (oppCount[pairKey(p1, cand)] || 0) * 10 + Math.random();
            if (sc < bestScore) { bestScore = sc; bestIdx = idx; }
          });
          const p2 = pool.splice(bestIdx, 1)[0];
          matches.push({
            id: uid('m'),
            court: courts[cIdx % courts.length],
            sideA: [p1],
            sideB: [p2],
            scoreA: null,
            scoreB: null,
          });
          cIdx++;
        }
        return { number: nextNum, matches, resting };
      }

      // Standard Americano / Round 1 Mexicano / Round 1 KOTH (4 players per court)
      // Use Monte Carlo best-of-40 sampling to minimize repeat partners & opponents
      const active = sortedByPlay.slice(0, activeCount).map(e => e.id);
      const resting = sortedByPlay.slice(activeCount).map(e => e.id);

      let bestSplit = null;
      let bestCost = Infinity;
      for (let trial = 0; trial < 45; trial++) {
        const arr = [...active].sort(() => Math.random() - 0.5);
        let cost = 0;
        for (let i = 0; i < arr.length; i += 4) {
          const [a, b, c, d] = arr.slice(i, i + 4);
          cost += (partnerCount[pairKey(a, b)] || 0) * 100;
          cost += (partnerCount[pairKey(c, d)] || 0) * 100;
          cost += (oppCount[pairKey(a, c)] || 0) * 12;
          cost += (oppCount[pairKey(a, d)] || 0) * 12;
          cost += (oppCount[pairKey(b, c)] || 0) * 12;
          cost += (oppCount[pairKey(b, d)] || 0) * 12;
        }
        if (cost < bestCost) {
          bestCost = cost;
          bestSplit = arr;
        }
      }

      const matches = [];
      for (let i = 0; i < bestSplit.length; i += 4) {
        matches.push({
          id: uid('m'),
          court: courts[(i / 4) % courts.length],
          sideA: [bestSplit[i], bestSplit[i + 1]],
          sideB: [bestSplit[i + 2], bestSplit[i + 3]],
          scoreA: null,
          scoreB: null,
        });
      }
      return { number: nextNum, matches, resting };
    }

                ${tr.status === 'active' ? `
                  <button onclick="handleGenerateNextRound('${tr.id}')" class="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs sm:text-sm font-bold shadow-sm flex items-center gap-1.5 transition">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                    <span>${t('nextRound')}</span>
                  </button>
                  <button onclick="toggleFinishTournament('${tr.id}')" class="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs sm:text-sm font-bold shadow-sm flex items-center gap-1.5 transition">
                    <i data-lucide="flag" class="w-4 h-4"></i>
                    <span>${t('finishTournament')}</span>
                  </button>
                ` : `
                  <button onclick="toggleFinishTournament('${tr.id}')" class="px-3.5 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    <span>${t('reopenTournament')}</span>
                  </button>
                `}
                ${state.cloud.connected ? `
                  <button onclick="syncTournamentToCloud(state.tournaments.find(x=>x.id==='${tr.id}'))" class="px-3 py-2 rounded-xl border border-emerald-200 dark:border-emerald-800 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-300 hover:bg-emerald-100 text-xs sm:text-sm font-bold flex items-center gap-1.5 transition">
                    <i data-lucide="cloud-upload" class="w-4 h-4"></i>
                    <span>Live</span>
                  </button>
                ` : ''}
              `}
              <button onclick="exportTournamentCsv('${tr.id}')" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800 text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition">
                <i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-600"></i>
                <span>CSV</span>
              </button>
            </div>
          </div>

          <!-- Champion Podium Banner (when finished) -->
          ${tr.status === 'finished' && lb.length > 0 ? renderChampionPodium(lb, tr) : ''}

          <!-- Format Hint Banner for KOTH / Knockout -->
          ${tr.format === 'koth' ? `
            <div class="mt-4 px-4 py-2.5 rounded-xl bg-amber-50 dark:bg-amber-900/20 border border-amber-200/80 dark:border-amber-800/50 text-xs text-amber-800 dark:text-amber-300 flex items-center gap-2">
              <i data-lucide="crown" class="w-4 h-4 shrink-0"></i>
              <span>${t('kothNote')}</span>
            </div>
          ` : ''}

          <!-- View Mode Tabs (Always lets user switch to Analytics; on mobile switches Leaderboard/Matches) -->
          <div class="flex items-center justify-between gap-2 mt-5 mb-4">
            <div class="inline-flex p-1 rounded-xl bg-slate-200/75 dark:bg-slate-800/90">
              <button onclick="setDetailTab('matches')" class="px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition flex items-center gap-1.5 ${
                state.detailTab === 'matches'
                  ? 'bg-white dark:bg-slate-700 text-brand-600 dark:text-white shadow-sm'
                  : 'text-slate-600 dark:text-slate-400'
              }">
                <i data-lucide="swords" class="w-3.5 h-3.5"></i>
                <span class="lg:hidden">${t('matchRounds')}</span>
                <span class="hidden lg:inline">${t('leaderboard')} & ${t('matchRounds')}</span>
              </button>
              <button onclick="setDetailTab('leaderboard')" class="lg:hidden px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition flex items-center gap-1.5 ${
                state.detailTab === 'leaderboard'
                  ? 'bg-white dark:bg-slate-700 text-brand-600 dark:text-white shadow-sm'
                  : 'text-slate-600 dark:text-slate-400'
              }">
                <i data-lucide="medal" class="w-3.5 h-3.5"></i>
                <span>${t('leaderboard')}</span>
              </button>
              <button onclick="setDetailTab('analytics')" class="px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition flex items-center gap-1.5 ${
                state.detailTab === 'analytics'
                  ? 'bg-white dark:bg-slate-700 text-brand-600 dark:text-white shadow-sm'
                  : 'text-slate-600 dark:text-slate-400'
              }">
                <i data-lucide="bar-chart-3" class="w-3.5 h-3.5"></i>
                <span>${t('analytics')}</span>
              </button>
            </div>

            <p class="hidden sm:flex items-center gap-1.5 text-xs text-slate-400 dark:text-slate-500">
              <i data-lucide="mouse-pointer-click" class="w-3.5 h-3.5"></i>
              <span>${t('editScoreHint')}</span>
            </p>
          </div>

          ${state.detailTab === 'analytics' ? renderAnalyticsPanel(tr, lb) : `
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              <!-- LEFT: Leaderboard -->
              <section class="lg:col-span-5 ${state.detailTab === 'leaderboard' ? 'block' : 'hidden lg:block'}">
                ${renderLeaderboardPanel(tr, lb)}
              </section>

              <!-- RIGHT: Match Rounds -->
              <section class="lg:col-span-7 ${state.detailTab === 'matches' ? 'block' : 'hidden lg:block'}">
                ${renderRoundsPanel(tr, entryMap)}
              </section>
            </div>
          `}
        </main>
      `;
    }

    function renderChampionPodium(lb, tr) {
      const first = lb[0];
      const second = lb[1];
      const third = lb[2];
      return `
        <div class="mt-5 rounded-3xl champion-glow border border-amber-200/70 dark:border-amber-800/40 p-6 text-center relative overflow-hidden">
          <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-amber-100 dark:bg-amber-900/40 text-amber-500 mb-3 shadow-sm">
            <i data-lucide="trophy" class="w-6 h-6"></i>
          </div>
          <div class="flex items-center justify-center gap-3">
            <span class="text-2xl text-amber-400/70 font-serif">“</span>
            <div class="px-6 py-2.5 rounded-2xl bg-gradient-to-b from-amber-50 to-amber-100/90 dark:from-amber-900/40 dark:to-amber-900/20 border-2 border-amber-300 dark:border-amber-600/70 shadow-glow">
              <span class="text-xl sm:text-2xl font-extrabold text-amber-900 dark:text-amber-200">🥇 ${escapeHtml(first.name)}</span>
            </div>
            <span class="text-2xl text-amber-400/70 font-serif">”</span>
          </div>
          <p class="text-xs font-bold uppercase tracking-widest text-amber-700 dark:text-amber-400 mt-2.5">${t('tournamentChampion')} • ${first.totalPoints} ${t('points')}</p>

          ${second || third ? `
            <div class="flex flex-wrap items-center justify-center gap-3 mt-4">
              ${second ? `<span class="px-3.5 py-1.5 rounded-xl bg-white/80 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-200">🥈 ${escapeHtml(second.name)} (${second.totalPoints} pts)</span>` : ''}
              ${third ? `<span class="px-3.5 py-1.5 rounded-xl bg-white/80 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-200">🥉 ${escapeHtml(third.name)} (${third.totalPoints} pts)</span>` : ''}
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderLeaderboardPanel(tr, lb) {
      return `
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-card overflow-hidden">
          <div class="px-4 py-3.5 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <i data-lucide="award" class="w-4 h-4 text-brand-600"></i>
              <h2 class="font-bold text-sm sm:text-base text-slate-900 dark:text-white">${t('leaderboard')}</h2>
            </div>
            <button onclick="toggleSortOrder('${tr.id}')" class="text-[11px] font-semibold px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
              ${tr.sortByWins ? t('winsFirst') : t('pointsFirst')}
            </button>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 border-b border-slate-100 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-800/40">
                  <th class="py-2.5 pl-4 pr-2">#</th>
                  <th class="py-2.5 px-2 text-center">W-L-T</th>
                  <th class="py-2.5 px-2 text-center">DIFF</th>
                  <th class="py-2.5 px-2 text-center">+M</th>
                  <th class="py-2.5 pl-2 pr-4 text-right">P</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 dark:divide-slate-800/80 text-sm">
                ${lb.map((row, idx) => {
                  const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `${idx + 1}.`;
                  const rowHighlight = idx === 0
                    ? 'bg-amber-50/60 dark:bg-amber-900/10'
                    : 'hover:bg-slate-50 dark:hover:bg-slate-800/40';
                  const diffClass = row.diff > 0
                    ? 'text-emerald-600 dark:text-emerald-400 font-semibold'
                    : row.diff < 0
                    ? 'text-rose-500 dark:text-rose-400 font-medium'
                    : 'text-slate-400';
                  return `
                    <tr onclick="openPlayerStatsModal('${tr.id}', '${row.id}')" class="${rowHighlight} cursor-pointer transition">
                      <td class="py-3 pl-4 pr-2">
                        <div class="flex items-center gap-2 min-w-0">
                          <span class="w-5 text-center text-xs font-bold text-slate-400 shrink-0">${medal}</span>
                          <span class="font-semibold text-slate-800 dark:text-slate-100 truncate max-w-[140px] sm:max-w-[180px]">${escapeHtml(row.name)}</span>
                        </div>
                      </td>
                      <td class="py-3 px-2 text-center text-xs font-medium text-slate-600 dark:text-slate-300 whitespace-nowrap">${row.wins}-${row.losses}-${row.ties}</td>
                      <td class="py-3 px-2 text-center text-xs ${diffClass}">${row.diff > 0 ? '+' + row.diff : row.diff}</td>
                      <td class="py-3 px-2 text-center text-xs text-slate-500 dark:text-slate-400">${row.compPoints}</td>
                      <td class="py-3 pl-2 pr-4 text-right font-extrabold text-brand-600 dark:text-brand-400">${row.totalPoints}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>

          <!-- PDLUP-Style Legend Footer -->
          <div class="px-4 py-3 bg-slate-50/80 dark:bg-slate-800/40 border-t border-slate-100 dark:border-slate-800 grid grid-cols-2 gap-x-4 gap-y-1 text-[11px] text-slate-500 dark:text-slate-400">
            <div><strong class="text-slate-700 dark:text-slate-300">W-L-T</strong> = ${t('legendWlt')}</div>
            <div><strong class="text-slate-700 dark:text-slate-300">DIFF</strong> = ${t('legendDiff')}</div>
            <div><strong class="text-slate-700 dark:text-slate-300">+M</strong> = ${t('legendM')}</div>
            <div><strong class="text-slate-700 dark:text-slate-300">P</strong> = ${t('legendP')}</div>
          </div>
        </div>
      `;
    }

    function renderRoundsPanel(tr, entryMap) {
      return `
        <div class="space-y-5">
          ${tr.rounds.map((r, rIdx) => {
            const isSwapping = state.swapModeRound === r.number;
            return `
              <div class="space-y-3">
                <div class="flex items-center justify-between gap-2">
                  <div class="flex items-center gap-2">
                    <h3 class="font-extrabold text-sm sm:text-base text-slate-900 dark:text-white">${t('round')} #${r.number}</h3>
                    ${tr.format === 'knockout' ? `<span class="text-[11px] font-semibold px-2 py-0.5 rounded-md bg-rose-100 dark:bg-rose-900/40 text-rose-700 dark:text-rose-300">${r.matches.length === 1 ? 'FINAL' : r.matches.length === 2 ? 'SEMIFINAL' : 'STAGE ' + r.number}</span>` : ''}
                  </div>
                  ${tr.status === 'active' ? `
                    <button onclick="toggleSwapMode(${r.number})" class="text-xs font-semibold px-2.5 py-1 rounded-lg transition flex items-center gap-1 ${
                      isSwapping
                        ? 'bg-brand-600 text-white'
                        : 'text-slate-500 hover:text-brand-600 hover:bg-brand-50 dark:hover:bg-slate-800'
                    }">
                      <i data-lucide="arrow-left-right" class="w-3.5 h-3.5"></i>
                      <span>${isSwapping ? t('doneSwapping') : t('swapPlayers')}</span>
                    </button>
                  ` : ''}
                </div>

                ${isSwapping ? `
                  <div class="px-3.5 py-2 rounded-xl bg-brand-50 dark:bg-brand-900/30 border border-brand-200 dark:border-brand-800 text-xs text-brand-700 dark:text-brand-300 flex items-center gap-2">
                    <i data-lucide="info" class="w-4 h-4 shrink-0"></i>
                    <span>${t('swapHint')}</span>
                  </div>
                ` : ''}

                <div class="space-y-3">
                  ${r.matches.map((m, mIdx) => renderMatchCard(tr, r, rIdx, m, mIdx, entryMap, isSwapping)).join('')}
                </div>

                ${r.resting && r.resting.length > 0 ? `
                  <div class="flex items-center flex-wrap gap-1.5 px-3.5 py-2 rounded-xl bg-slate-100/90 dark:bg-slate-900 border border-slate-200/70 dark:border-slate-800 text-xs text-slate-600 dark:text-slate-400">
                    <i data-lucide="coffee" class="w-3.5 h-3.5 text-slate-400"></i>
                    <span class="font-semibold">${t('sittingOut')}:</span>
                    ${r.resting.map(id => `<span class="px-2 py-0.5 rounded-md bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-medium text-slate-700 dark:text-slate-200">${escapeHtml(entryMap[id]?.name || id)}</span>`).join('')}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}

          ${tr.status === 'active' ? `
            <button onclick="handleGenerateNextRound('${tr.id}')" class="w-full py-3 rounded-2xl border-2 border-dashed border-brand-300 dark:border-brand-800 hover:border-brand-500 hover:bg-brand-50/50 dark:hover:bg-brand-900/20 text-brand-600 dark:text-brand-400 font-bold text-sm flex items-center justify-center gap-2 transition">
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span>${t('nextRound')} (#${tr.rounds.length + 1})</span>
            </button>
          ` : ''}
        </div>
      `;
    }

    function renderMatchCard(tr, r, rIdx, m, mIdx, entryMap, isSwapping) {
      const scored = m.scoreA !== null && m.scoreB !== null;
      const aWon = scored && Number(m.scoreA) > Number(m.scoreB);
      const bWon = scored && Number(m.scoreB) > Number(m.scoreA);

      const scoreAClass = !scored
        ? 'bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-500 border-2 border-dashed border-slate-300 dark:border-slate-700'
        : aWon
        ? 'bg-brand-600 text-white shadow-sm shadow-brand-600/30'
        : 'bg-slate-900 dark:bg-slate-700 text-white';

      const scoreBClass = !scored
        ? 'bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-500 border-2 border-dashed border-slate-300 dark:border-slate-700'
        : bWon
        ? 'bg-brand-600 text-white shadow-sm shadow-brand-600/30'
        : 'bg-slate-900 dark:bg-slate-700 text-white';

      const renderSidePlayer = (entryId, side, slotIdx, alignRight) => {
        const isSelected = state.swapSelection &&
          state.swapSelection.roundIdx === rIdx &&
          state.swapSelection.matchIdx === mIdx &&
          state.swapSelection.side === side &&
          state.swapSelection.slotIdx === slotIdx;

        const name = entryMap[entryId]?.name || entryId;
        const winnerBold = (side === 'sideA' && aWon) || (side === 'sideB' && bWon);

        if (isSwapping) {
          return `
            <button onclick="handleSwapTap('${tr.id}', ${rIdx}, ${mIdx}, '${side}', ${slotIdx})" class="px-2.5 py-1 rounded-lg text-xs sm:text-sm font-semibold border transition ${
              isSelected
                ? 'bg-brand-600 text-white border-brand-600 ring-2 ring-brand-400/50'
                : 'bg-brand-50/60 dark:bg-brand-900/20 text-slate-800 dark:text-slate-100 border-brand-200 dark:border-brand-800 hover:bg-brand-100'
            } ${alignRight ? 'ml-auto' : ''}">${escapeHtml(name)}</button>
          `;
        }
        return `<div class="text-sm sm:text-[15px] truncate ${winnerBold ? 'font-bold text-slate-900 dark:text-white' : 'font-medium text-slate-600 dark:text-slate-300'}">${escapeHtml(name)}</div>`;
      };

      return `
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 p-4 shadow-card hover:border-brand-200 dark:hover:border-slate-700 transition">
          <!-- Top Row: Score Pills Centered + Court Pill Right -->
          <div class="flex items-center justify-between gap-2 mb-3">
            <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">Match ${mIdx + 1}</span>

            <button onclick="openScoreModal('${tr.id}', ${rIdx}, ${mIdx})" class="flex items-center gap-2 group" title="${t('enterScore')}">
              <span class="score-pill min-w-[44px] h-10 px-2.5 rounded-xl font-extrabold text-base sm:text-lg flex items-center justify-center ${scoreAClass}">
                ${scored ? m.scoreA : '–'}
              </span>
              <span class="text-xs font-bold text-slate-300 dark:text-slate-600">VS</span>
              <span class="score-pill min-w-[44px] h-10 px-2.5 rounded-xl font-extrabold text-base sm:text-lg flex items-center justify-center ${scoreBClass}">
                ${scored ? m.scoreB : '–'}
              </span>
            </button>

            <span class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-[11px] font-semibold text-slate-600 dark:text-slate-300 truncate max-w-[120px]">
              ${escapeHtml(m.court)}
            </span>
          </div>

          <!-- Players Row -->
          <div class="grid grid-cols-2 gap-4 items-center pt-1">
            <div class="space-y-1.5 min-w-0 flex flex-col items-start">
              ${m.sideA.map((id, idx) => renderSidePlayer(id, 'sideA', idx, false)).join('')}
            </div>
            <div class="space-y-1.5 min-w-0 flex flex-col items-end text-right">
              ${m.sideB.map((id, idx) => renderSidePlayer(id, 'sideB', idx, true)).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 9. ANALYTICS VIEW (Chart.js)
    // =========================================================================
    function renderAnalyticsPanel(tr, lb) {
      const totalMatches = tr.rounds.reduce((acc, r) => acc + r.matches.length, 0);
      const completedMatches = tr.rounds.reduce((acc, r) => acc + r.matches.filter(m => m.scoreA !== null && m.scoreB !== null).length, 0);
      const topScorer = lb[0];

      return `
        <div class="space-y-5">
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 p-4 shadow-card">
              <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">${t('rounds')}</p>
              <p class="text-2xl font-extrabold text-slate-900 dark:text-white mt-1">${tr.rounds.length}</p>
            </div>
            <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 p-4 shadow-card">
              <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">${t('matchesPlayed')}</p>
              <p class="text-2xl font-extrabold text-brand-600 dark:text-brand-400 mt-1">${completedMatches}/${totalMatches}</p>
            </div>
            <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 p-4 shadow-card">
              <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">${t('courts')}</p>
              <p class="text-2xl font-extrabold text-slate-900 dark:text-white mt-1">${tr.courts.length}</p>
            </div>
            <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 p-4 shadow-card">
              <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">#1 Leader</p>
              <p class="text-base font-extrabold text-amber-600 dark:text-amber-400 mt-1.5 truncate">${topScorer ? escapeHtml(topScorer.name) : '–'}</p>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 p-5 shadow-card">
            <h3 class="font-bold text-sm sm:text-base text-slate-900 dark:text-white mb-4">${t('leaderboard')} — ${t('points')} & DIFF</h3>
            <div class="relative h-72 w-full">
              <canvas id="pointsChart"></canvas>
            </div>
          </div>
        </div>
      `;
    }

    function renderAnalyticsChart(tr) {
      const ctx = document.getElementById('pointsChart');
      if (!ctx || !window.Chart) return;
      const lb = computeLeaderboard(tr);
      const isDark = state.darkMode;
      const textColor = isDark ? '#cbd5e1' : '#475569';
      const gridColor = isDark ? 'rgba(148,163,184,0.12)' : 'rgba(148,163,184,0.2)';

      activeChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: lb.map(r => r.name.length > 14 ? r.name.slice(0, 13) + '…' : r.name),
          datasets: [
            {
              label: t('points'),
              data: lb.map(r => r.totalPoints),
              backgroundColor: 'rgba(13, 148, 136, 0.88)',
              borderRadius: 8,
            },
            {
              label: 'DIFF',
              data: lb.map(r => r.diff),
              backgroundColor: lb.map(r => r.diff >= 0 ? 'rgba(16, 185, 129, 0.78)' : 'rgba(244, 63, 94, 0.78)'),
              borderRadius: 8,
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: textColor, font: { family: 'Inter', weight: '600' } } }
          },
          scales: {
            x: { ticks: { color: textColor }, grid: { display: false } },
            y: { ticks: { color: textColor }, grid: { color: gridColor } }
          }
        }
      });
    }

    // =========================================================================
    // 10. MODALS (Create Tournament, Scoreboard, Manage Players, Share, Settings)
    // =========================================================================
    function closeModal() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        timerRunning = false;
      }

    function selectDraftFormat(fmtId) {
      const prevMode = getFormatMeta(draftForm.format).mode;
      const nextMode = getFormatMeta(fmtId).mode;
      draftForm.format = fmtId;
      if (prevMode !== nextMode && nextMode === 'team') {
        draftForm.players = [
          { name: 'Team 1 (Alex & Chris)', gender: 'M' },
          { name: 'Team 2 (Bella & Dina)', gender: 'F' },
          { name: 'Team 3 (Evan & Gilang)', gender: 'M' },
          { name: 'Team 4 (Fiona & Hana)', gender: 'F' },
        ];
      } else if (prevMode === 'team' && nextMode !== 'team') {
        draftForm.players = [
          { name: 'Alex', gender: 'M' }, { name: 'Bella', gender: 'F' },
          { name: 'Chris', gender: 'M' }, { name: 'Dina', gender: 'F' },
          { name: 'Evan', gender: 'M' }, { name: 'Fiona', gender: 'F' },
          { name: 'Gilang', gender: 'M' }, { name: 'Hana', gender: 'F' },
        ];
      }
      renderCreateModal();
    }

    function addDraftPlayer() {
      const inp = document.getElementById('new-player-input');
      if (!inp) return;
      const val = inp.value.trim();
      if (!val) return;
      draftForm.players.push({ name: val, gender: draftForm.players.length % 2 === 0 ? 'M' : 'F' });
      renderCreateModal();
      setTimeout(() => { const el = document.getElementById('new-player-input'); if (el) el.focus(); }, 20);
    }

    function applyBulkPlayers() {
      const ta = document.getElementById('bulk-names');
      if (!ta) return;
      const names = ta.value.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
      if (names.length === 0) return;
      draftForm.players = names.map((name, i) => ({ name, gender: i % 2 === 0 ? 'M' : 'F' }));
      draftForm.showBulk = false;
      renderCreateModal();
    }

    function submitCreateTournament() {
      const fmt = getFormatMeta(draftForm.format);
      const validPlayers = draftForm.players.map(p => ({ ...p, name: p.name.trim() })).filter(p => p.name);
      if (validPlayers.length < fmt.minEntries) {
        showToast(state.lang === 'id' ? `Minimal butuh ${fmt.minEntries} peserta untuk format ${fmt.name}` : `Need at least ${fmt.minEntries} entries for ${fmt.name}`, 'error');
        return;
      }
      if (fmt.mode === 'mixed') {
        const mCount = validPlayers.filter(p => p.gender === 'M').length;
        const fCount = validPlayers.filter(p => p.gender === 'F').length;
        if (mCount < 2 || fCount < 2) {
          showToast(state.lang === 'id' ? 'Mix Americano butuh minimal 2 pemain L dan 2 pemain P' : 'Mix Americano needs at least 2 Male and 2 Female players', 'error');
          return;
        }
      }

      const newTr = ensureTournamentMeta({
        id: uid('tr'),
        name: draftForm.name.trim() || `${fmt.name} — ${formatDateDisplay(draftForm.date)}`,
        location: draftForm.location.trim(),
        format: draftForm.format,
        date: draftForm.date,
        time: draftForm.time,
        status: 'active',
        scoringMode: draftForm.scoringMode,
        targetScore: Number(draftForm.targetScore) || 21,
        mexicanoPairing: draftForm.mexicanoPairing,
        sortByWins: draftForm.sortByWins,
        compensationMode: draftForm.compensationMode,
        courts: draftForm.courts.map(c => c.trim()).filter(Boolean),
        entries: validPlayers.map(p => ({ id: uid('p'), name: p.name, gender: p.gender })),
        rounds: [],
      });

      const round1 = generateNextRound(newTr);
      if (round1) newTr.rounds.push(round1);

      state.tournaments.unshift(newTr);
      state.activeTournamentId = newTr.id;
      state.view = 'detail';
      state.detailTab = 'matches';
      saveState(true);
      subscribeToTournament(newTr);
      closeModal();
      render();
      showToast(t('createdToast'), 'success');
    }

    // --- B. SCOREBOARD MODAL (With Auto-Balance & Live Timer) ---
    let scoreDraft = null;

    function openScoreModal(trId, rIdx, mIdx) {
      const tr = state.tournaments.find(x => x.id === trId);
      if (!tr) return;
      if (tr.readOnly) {
        showToast(t('viewerModeBadge'), 'info');
        return;
      }
      const m = tr.rounds[rIdx].matches[mIdx];
      const entryMap = Object.fromEntries(tr.entries.map(e => [e.id, e]));

      scoreDraft = {
        trId,
        rIdx,
        mIdx,
        scoreA: m.scoreA !== null ? Number(m.scoreA) : Math.floor(tr.targetScore / 2),
        scoreB: m.scoreB !== null ? Number(m.scoreB) : (tr.scoringMode === 'total_points' ? tr.targetScore - Math.floor(tr.targetScore / 2) : Math.floor(tr.targetScore / 2)),
        autoBalance: tr.scoringMode === 'total_points',
        targetScore: tr.targetScore,
        scoringMode: tr.scoringMode,
        court: m.court,
        sideANames: m.sideA.map(id => entryMap[id]?.name || id).join(' & '),
        sideBNames: m.sideB.map(id => entryMap[id]?.name || id).join(' & '),
      };
      timerSeconds = 0;
      timerRunning = false;
      renderScoreModal();
    }

    function renderScoreModal() {
      const d = scoreDraft;
      const root = document.getElementById('modal-root');
      const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const secs = String(timerSeconds % 60).padStart(2, '0');

      const presets = d.scoringMode === 'total_points'
        ? [
            [Math.round(d.targetScore * 0.75), d.targetScore - Math.round(d.targetScore * 0.75)],
            [Math.round(d.targetScore * 0.62), d.targetScore - Math.round(d.targetScore * 0.62)],
            [Math.floor(d.targetScore / 2), Math.ceil(d.targetScore / 2)],
            [d.targetScore - Math.round(d.targetScore * 0.62), Math.round(d.targetScore * 0.62)],
          ]
        : [[d.targetScore, Math.max(0, d.targetScore - 2)], [d.targetScore, Math.max(0, d.targetScore - 4)], [Math.max(0, d.targetScore - 2), d.targetScore]];

      root.innerHTML = `
        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 modal-backdrop" onclick="if(event.target===this) closeModal()">
          <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl w-full max-w-md overflow-hidden modal-panel">
            <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
              <div>
                <h3 class="font-extrabold text-base text-slate-900 dark:text-white">${t('enterScore')}</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400">${escapeHtml(d.court)} • ${t('round')} #${d.rIdx + 1}</p>
              </div>
              <button onclick="closeModal()" class="w-8 h-8 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center text-slate-400">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>

            <div class="p-5 space-y-5">
              <!-- Score Steppers -->
              <div class="grid grid-cols-2 gap-4 items-center">
                <div class="p-4 rounded-2xl bg-brand-50/70 dark:bg-brand-900/20 border border-brand-200/80 dark:border-brand-800/60 text-center">
                  <p class="text-xs font-bold text-slate-700 dark:text-slate-200 truncate mb-3">${escapeHtml(d.sideANames)}</p>
                  <div class="flex items-center justify-center gap-2">
                    <button onclick="adjustScore('A', -1)" class="w-9 h-9 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold text-lg hover:bg-slate-100 transition">−</button>
                    <input type="number" min="0" max="99" value="${d.scoreA}" oninput="setDirectScore('A', this.value)" class="w-14 text-center text-2xl font-black bg-transparent text-brand-600 dark:text-brand-400 focus:outline-none" />
                    <button onclick="adjustScore('A', 1)" class="w-9 h-9 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-lg transition">+</button>
                  </div>
                </div>

                <div class="p-4 rounded-2xl bg-slate-100/80 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-center">
                  <p class="text-xs font-bold text-slate-700 dark:text-slate-200 truncate mb-3">${escapeHtml(d.sideBNames)}</p>
                  <div class="flex items-center justify-center gap-2">
                    <button onclick="adjustScore('B', -1)" class="w-9 h-9 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold text-lg hover:bg-slate-100 transition">−</button>
                    <input type="number" min="0" max="99" value="${d.scoreB}" oninput="setDirectScore('B', this.value)" class="w-14 text-center text-2xl font-black bg-transparent text-slate-900 dark:text-white focus:outline-none" />
                    <button onclick="adjustScore('B', 1)" class="w-9 h-9 rounded-xl bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 text-white font-bold text-lg transition">+</button>
                  </div>
                </div>
              </div>

              <!-- Quick Score Presets -->
              <div class="flex flex-wrap items-center justify-center gap-2">
                ${presets.map(([a, b]) => `
                  <button onclick="scoreDraft.scoreA=${a}; scoreDraft.scoreB=${b}; renderScoreModal()" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-brand-100 dark:hover:bg-brand-900/40 text-xs font-bold text-slate-700 dark:text-slate-300 transition">${a} – ${b}</button>
                `).join('')}
              </div>

              ${d.scoringMode === 'total_points' ? `
                <label class="flex items-center justify-between px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/70 dark:border-slate-700 cursor-pointer">
                  <span class="text-xs font-semibold text-slate-700 dark:text-slate-300">${t('autoBalanceScore')} (Total ${d.targetScore})</span>
                  <input type="checkbox" ${d.autoBalance ? 'checked' : ''} onchange="scoreDraft.autoBalance=this.checked" class="w-4 h-4 accent-brand-600 rounded" />

              ` : ''}

              <!-- Built-in Match Timer -->
              <div class="flex items-center justify-between px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/70 dark:border-slate-700">
                <div class="flex items-center gap-2">
                  <i data-lucide="timer" class="w-4 h-4 text-brand-600"></i>
                  <span class="text-xs font-semibold text-slate-600 dark:text-slate-300">${t('matchTimer')}</span>
                  <span id="modal-timer-display" class="font-mono font-bold text-sm text-slate-900 dark:text-white ml-1">${mins}:${secs}</span>
                </div>
                <div class="flex items-center gap-1.5">
                  <button onclick="toggleMatchTimer()" class="px-2.5 py-1 rounded-lg bg-brand-600 text-white text-[11px] font-bold">${timerRunning ? t('pause') : t('start')}</button>
                  <button onclick="resetMatchTimer()" class="px-2 py-1 rounded-lg bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-[11px] font-bold">${t('reset')}</button>
                </div>
              </div>
            </div>

            <div class="px-5 py-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between bg-slate-50/70 dark:bg-slate-900">
              <button onclick="clearMatchScore()" class="text-xs font-semibold text-rose-500 hover:underline">Reset Skor</button>
              <div class="flex items-center gap-2">
                <button onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-800">${t('cancel')}</button>
                <button onclick="saveMatchScore()" class="px-5 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold shadow-sm">${t('save')}</button>
              </div>
            </div>
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons({ nodes: [root] });
    }

    function adjustScore(side, delta) {
      if (side === 'A') {
        scoreDraft.scoreA = Math.max(0, scoreDraft.scoreA + delta);
        if (scoreDraft.autoBalance) scoreDraft.scoreB = Math.max(0, scoreDraft.targetScore - scoreDraft.scoreA);
      } else {
        scoreDraft.scoreB = Math.max(0, scoreDraft.scoreB + delta);
        if (scoreDraft.autoBalance) scoreDraft.scoreA = Math.max(0, scoreDraft.targetScore - scoreDraft.scoreB);
      }
      renderScoreModal();
    }

    function setDirectScore(side, val) {
      const n = Math.max(0, parseInt(val, 10) || 0);
      if (side === 'A') {
        scoreDraft.scoreA = n;
        if (scoreDraft.autoBalance) scoreDraft.scoreB = Math.max(0, scoreDraft.targetScore - n);
      } else {
        scoreDraft.scoreB = n;
        if (scoreDraft.autoBalance) scoreDraft.scoreA = Math.max(0, scoreDraft.targetScore - n);
      }
    }

    function toggleMatchTimer() {
      if (timerRunning) {
        clearInterval(timerInterval);
        timerInterval = null;
        timerRunning = false;
      } else {
        timerRunning = true;
        timerInterval = setInterval(() => {
          timerSeconds++;
          const el = document.getElementById('modal-timer-display');
          if (el) {
            el.textContent = `${String(Math.floor(timerSeconds / 60)).padStart(2, '0')}:${String(timerSeconds % 60).padStart(2, '0')}`;
          }
        }, 1000);
      }
      renderScoreModal();
    }

    function resetMatchTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      timerRunning = false;
      timerSeconds = 0;
      renderScoreModal();
    }

    function clearMatchScore() {
      const tr = state.tournaments.find(x => x.id === scoreDraft.trId);
      if (!tr) return;
      tr.rounds[scoreDraft.rIdx].matches[scoreDraft.mIdx].scoreA = null;
      tr.rounds[scoreDraft.rIdx].matches[scoreDraft.mIdx].scoreB = null;
      saveState();
      closeModal();
      render();
    }

    function saveMatchScore() {
      const tr = state.tournaments.find(x => x.id === scoreDraft.trId);
      if (!tr) return;
      tr.rounds[scoreDraft.rIdx].matches[scoreDraft.mIdx].scoreA = Number(scoreDraft.scoreA);
      tr.rounds[scoreDraft.rIdx].matches[scoreDraft.mIdx].scoreB = Number(scoreDraft.scoreB);
      saveState(true);
      closeModal();
      render();
      showToast(t('savedToast'), 'success');
    }

    // --- C. SHARE RESULT MODAL ---
    function openShareModal(trId) {
      const tr = state.tournaments.find(x => x.id === trId);
      if (!tr) return;
      const lb = computeLeaderboard(tr);
      const fmt = getFormatMeta(tr.format);

      const waText = [
        `🎾 *${tr.name}*`,

        tr.location ? `📍 ${tr.location}` : null,
        `📅 ${formatDateDisplay(tr.date)} ${tr.time || ''}`,
        '',
        `🏆 *${t('leaderboard').toUpperCase()}*`,
        ...lb.map((r, i) => {
          const m = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`;

              <div class="flex items-center justify-between mb-3">
                <span class="text-[11px] font-bold uppercase tracking-widest opacity-80">${fmt.name}</span>

              <h3 class="text-xl font-extrabold">${escapeHtml(tr.name)}</h3>

              <div class="mt-4 space-y-1.5">
                ${lb.slice(0, 5).map((r, i) => `
                  <div class="flex items-center justify-between px-3 py-2 rounded-xl bg-white/12 backdrop-blur-sm text-xs">
                    <span class="font-bold truncate">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1) + '.'} ${escapeHtml(r.name)}</span>
                    <span class="font-extrabold ml-2">${r.totalPoints} pts</span>

                <div class="flex items-center justify-between gap-2">
                  <div>
                    <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">${t('shareCodeLabel')}</p>
                    <p class="font-mono font-extrabold text-lg tracking-widest text-brand-600 dark:text-brand-400">${escapeHtml(ensureTournamentMeta(tr).shareCode)}</p>
                  </div>
                  ${!tr.readOnly ? `
                    <div class="text-right">
                      <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Admin PIN</p>
                      <p class="font-mono font-extrabold text-base tracking-widest text-amber-600 dark:text-amber-400">${escapeHtml(tr.adminPin)}</p>
                    </div>
                  ` : ''}
                </div>

                ${state.cloud.connected ? `
                  <button onclick="syncTournamentToCloud(state.tournaments.find(x=>x.id==='${tr.id}'))" class="w-full py-2 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold flex items-center justify-center gap-1.5 transition">
                    <i data-lucide="cloud-upload" class="w-3.5 h-3.5"></i> ${t('syncToCloud')}
                  </button>
                ` : `
                  <p class="text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed">${t('cloudNeedSetup')}</p>
                `}

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  <button onclick="copyLiveLink('${tr.id}', false)" class="py-2 px-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 hover:border-brand-400 text-xs font-bold text-slate-700 dark:text-slate-200 flex items-center justify-center gap-1.5 transition">
                    <i data-lucide="eye" class="w-3.5 h-3.5 text-brand-600"></i> ${t('viewerLink')}
                  </button>
                  ${!tr.readOnly ? `
                    <button onclick="copyLiveLink('${tr.id}', true)" class="py-2 px-3 rounded-xl bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 hover:border-amber-400 text-xs font-bold text-amber-800 dark:text-amber-300 flex items-center justify-center gap-1.5 transition">
                      <i data-lucide="shield-check" class="w-3.5 h-3.5"></i> ${t('shareAdminAccess')}
                    </button>
                  ` : ''}

              </div>

              <textarea id="wa-share-text" readonly rows="4" class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-mono text-slate-700 dark:text-slate-300 focus:outline-none">${escapeHtml(waText)}</textarea>
              <div class="grid grid-cols-2 gap-2.5">

                  <i data-lucide="copy" class="w-4 h-4"></i> ${t('copyWhatsApp')}
                </button>
                <button onclick="exportTournamentCsv('${tr.id}')" class="py-2.5 px-4 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold flex items-center justify-center gap-1.5 transition">
                  <i data-lucide="download" class="w-4 h-4"></i> ${t('exportCsv')}
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons({ nodes: [root] });
    }

    function copyShareText() {
      const ta = document.getElementById('wa-share-text');
      if (!ta) return;
      const text = ta.value;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(t('copiedToast'), 'success')).catch(() => fallbackCopy(ta));
      } else {
        fallbackCopy(ta);
      }
    }

    function fallbackCopy(ta) {
      ta.select();
      try { document.execCommand('copy'); showToast(t('copiedToast'), 'success'); } catch (e) {}
    }

    // --- D. MANAGE PLAYERS & COURTS MODAL ---
    function openManagePlayersModal(trId) {
      const tr = state.tournaments.find(x => x.id === trId);
      if (!tr) return;
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 modal-backdrop" onclick="if(event.target===this) closeModal()">
          <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl w-full max-w-md max-h-[85vh] flex flex-col overflow-hidden modal-panel">
            <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
              <h3 class="font-extrabold text-base text-slate-900 dark:text-white">${t('managePlayersCourts')}</h3>
              <button onclick="closeModal()" class="w-8 h-8 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>

                <div class="flex gap-2 mb-2.5">
                  <input id="mp-new-player" type="text" placeholder="Nama pemain baru..." onkeydown="if(event.key==='Enter'){addLivePlayer('${tr.id}');}" class="flex-1 px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs" />
                  <button onclick="addLivePlayer('${tr.id}')" class="px-3.5 py-2 rounded-xl bg-brand-600 text-white text-xs font-bold">${t('addPlayer')}</button>
                </div>
                <div class="space-y-1.5">
                  ${tr.entries.map((e, idx) => `
                    <div class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200/70 dark:border-slate-700">
                      <span class="text-xs text-slate-400 font-bold w-5">${idx + 1}.</span>
                      <input type="text" value="${escapeHtml(e.name)}" onchange="renameLivePlayer('${tr.id}', '${e.id}', this.value)" class="flex-1 bg-transparent text-xs font-semibold focus:outline-none" />

                  `).join('')}
                </div>
              </div>

              <div>
                <div class="flex items-center justify-between mb-2">
                  <label class="text-xs font-bold uppercase tracking-wider text-slate-500">${t('courtNames')} (${tr.courts.length})</label>
                  <button onclick="addLiveCourt('${tr.id}')" class="text-xs font-bold text-brand-600 hover:underline">+ ${t('addCourt')}</button>
                </div>
                <div class="space-y-1.5">
                  ${tr.courts.map((c, idx) => `
                    <div class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200/70 dark:border-slate-700">
                      <input type="text" value="${escapeHtml(c)}" onchange="renameLiveCourt('${tr.id}', ${idx}, this.value)" class="flex-1 bg-transparent text-xs font-semibold focus:outline-none" />
                      ${tr.courts.length > 1 ? `<button onclick="removeLiveCourt('${tr.id}', ${idx})" class="text-slate-400 hover:text-rose-500"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>` : ''}
                    </div>
                  `).join('')}
                </div>
              </div>

              <button onclick="closeModal(); render();" class="px-5 py-2 rounded-xl bg-brand-600 text-white text-xs font-bold">${t('close')}</button>
            </div>
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons({ nodes: [root] });
    }

    function addLivePlayer(trId) {
      const tr = state.tournaments.find(x => x.id === trId);
      const inp = document.getElementById('mp-new-player');
      if (!tr || !inp || !inp.value.trim()) return;
      tr.entries.push({ id: uid('p'), name: inp.value.trim(), gender: tr.entries.length % 2 === 0 ? 'M' : 'F' });
      saveState();
      openManagePlayersModal(trId);
      showToast(t('savedToast'), 'success');
    }
    function renameLivePlayer(trId, entryId, val) {
      const tr = state.tournaments.find(x => x.id === trId);
      const e = tr && tr.entries.find(x => x.id === entryId);
      if (e && val.trim()) { e.name = val.trim(); saveState(); }
    }
    function addLiveCourt(trId) {
      const tr = state.tournaments.find(x => x.id === trId);
      if (!tr) return;
      tr.courts.push(`Court ${tr.courts.length + 1}`);
      saveState();
      openManagePlayersModal(trId);
    }
    function renameLiveCourt(trId, idx, val) {
      const tr = state.tournaments.find(x => x.id === trId);
      if (tr && val.trim()) { tr.courts[idx] = val.trim(); saveState(); }
    }
    function removeLiveCourt(trId, idx) {
      const tr = state.tournaments.find(x => x.id === trId);
      if (tr && tr.courts.length > 1) { tr.courts.splice(idx, 1); saveState(); openManagePlayersModal(trId); }
    }

                  <p class="text-xl font-extrabold text-emerald-600 dark:text-emerald-400">${winRate}%</p>

                <div class="p-3 rounded-2xl bg-slate-100 dark:bg-slate-800">

              <div>
                <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">${t('matchHistory')}</h4>
                ${p.history.length === 0 ? `<p class="text-xs text-slate-500">${t('noMatchesYet')}</p>` : `
                  <div class="space-y-2 max-h-56 overflow-y-auto">
                    ${p.history.map(h => {
                      const won = h.myScore > h.oppScore;
                      const tied = h.myScore === h.oppScore;
                      const partnerNames = h.partnerIds.map(id => entryMap[id]?.name || id).join(', ');
                      const oppNames = h.oppIds.map(id => entryMap[id]?.name || id).join(' & ');

                        <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200/60 dark:border-slate-700 flex items-center justify-between gap-2 text-xs">
                          <div class="min-w-0">
                            <div class="font-bold text-slate-800 dark:text-slate-100">${t('round')} #${h.round} • ${escapeHtml(h.court)}</div>
                            <div class="text-slate-500 dark:text-slate-400 truncate mt-0.5">${partnerNames ? `w/ ${escapeHtml(partnerNames)} ` : ''}vs ${escapeHtml(oppNames)}</div>
                          </div>
                          <span class="px-2.5 py-1 rounded-lg font-extrabold shrink-0 ${
                            won ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300'

                              : 'bg-rose-100 text-rose-700 dark:bg-rose-900/40 dark:text-rose-300'
                          }">${h.myScore} – ${h.oppScore}</span>
                        </div>
                      `;
                    }).join('')}
                  </div>
                `}
              </div>
            </div>
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons({ nodes: [root] });
    }
